<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent — Valence Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a0a0a;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .check {
    width: 64px; height: 64px;
    background: rgba(26, 95, 150, 0.15);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 32px;
    font-size: 1.8rem;
  }
  h1 {
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  p {
    font-size: 1.05rem;
    color: #b0b0b0;
    max-width: 480px;
    line-height: 1.7;
    margin-bottom: 36px;
  }
  a {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 28px;
    background: #1a5f96;
    color: white;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
  }
  a:hover { background: #144d7a; transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="check">&#10003;</div>
  <h1>Message Sent</h1>
  <p>Thanks for reaching out. We'll review your message and get back to you within one business day.</p>
  <a href="/">Back to Home &rarr;</a>
</body>
</html>
